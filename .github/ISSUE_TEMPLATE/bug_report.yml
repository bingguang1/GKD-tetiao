name: 错误反馈 / Bug report
title: "[BUG] "
description: 反馈你遇到的错误 / Report the bug you encountered
labels: ["pending triage"]

body:
  - type: markdown
    attributes:
      value: |
        ## 感谢您花时间填写，在提交问题之前，请确保您完成以下操作
        > ⚠️ **本仓库是 [GKD](https://github.com/gkd-kit/gkd) 的非官方修改版(fork)，不是官方仓库。**
        > GKD 应用本体的问题请提交到 [上游仓库](https://github.com/gkd-kit/gkd/issues)，此处只受理本 fork 特有改动导致的问题。
        1. 请 **确保** 您已经查阅了 [GKD 官方文档](https://gkd.li) 以及 [常见问题](https://gkd.li/guide/faq)
        2. 请 **判断** 是不是第三方规则订阅的问题，如果是，你应该向规则提供者反馈，而不是在这里提交，**此处只接受 GKD 应用本体的问题**
        3. 请 **确保** 已有的 [问题](https://github.com/bingguang1/gkd-tejiao/issues?q=is%3Aissue) 中没有人提交过相似问题，否则请在该问题下进行讨论
        4. 请 **确保** 你的问题能在本仓库 [releases](https://github.com/bingguang1/gkd-tejiao/releases/latest) 的最新版本上复现 (如果不是请先更新到最新版本复现后再提交问题)
  - type: textarea
    id: log-file
    attributes:
      label: |
        日志文件
      description: |
        首页-设置-关于-日志，上传日志文件或生成链接并粘贴到下面的输入框\
        任何问题都需要提供日志文件. 否则将直接关闭，请不要纯发文字/截图/视频
    validations:
      required: true
  - type: textarea
    id: bug-1
    attributes:
      label: |
        BUG描述(文字/截图/视频)
      description: |
        请使用尽量准确的描述，否则你的问题将会被直接关闭\
        另外如果你的问题是关于快照/选择器的，请必须提供快照链接或者快照文件，否则你的问题将会被直接关闭
    validations:
      required: true
  - type: textarea
    id: bug-2
    attributes:
      label: |
        期望行为(文字/截图/视频)
      description: |
        请使用尽量准确的描述，否则你的问题将会被直接关闭
    validations:
      required: true
  - type: textarea
    id: bug-3
    attributes:
      label: |
        实际行为(文字/截图/视频)
      description: |
        请使用尽量准确的描述，否则你的问题将会被直接关闭
    validations:
      required: true
