name: 功能请求 / Feature request
title: "[Feature] "
description: 提出你的功能请求 / Propose your feature request
labels: ["pending triage"]

body:
  - type: markdown
    attributes:
      value: |
        ## 感谢您花时间填写，在提交问题之前，请确保您完成以下操作
        > ⚠️ **本仓库是 [GKD](https://github.com/gkd-kit/gkd) 的非官方修改版(fork)，不是官方仓库。**
        > 面向 GKD 本体的功能请求请提交到 [上游仓库](https://github.com/gkd-kit/gkd/issues)，此处只受理本 fork 特有的功能请求。
        1. GKD 默认不提供任何规则，你可以查看 [GKD 官方文档](https://gkd.li) 后自行编写规则或者导入远程订阅，请不要再提出类似想要XXX规则这种问题
        2. 请 **判断** 是不是第三方规则订阅的功能请求，如果是，你应该向规则提供者反馈，而不是在这里提交，**此处只接受 GKD 应用本体的功能请求**
        3. 请 **确保** 已有的 [问题](https://github.com/bingguang1/gkd-tejiao/issues?q=is%3Aissue) 中没有人提交过相似问题，否则请在该问题下进行讨论
        4. 请 **确保** 你想要的功能在本仓库 [releases](https://github.com/bingguang1/gkd-tejiao/releases/latest) 的最新版本上没有找到 (如果不是请先更新到最新版本验证后再提交问题)
  - type: textarea
    id: feature-description
    attributes:
      label: |
        新功能描述
      description: |
        例如: 我希望在 GKD 中的什么页面添加什么功能，以及这个功能的作用是什么\
        或者在规则定义中添加某个字段，以及这个字段的作用是什么\
        请使用准确的描述，否则你的问题将会被直接关闭
    validations:
      required: true
